<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA Media Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="app.css?v=9">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="field" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div id="boot"><div class="spin"></div><div>Opening your workspace…</div></div>

<div id="auth">
  <div class="auth-card glass">
    <div class="brand"><div class="brand-mark">SA</div><div><div class="brand-name">SA Media Empire</div><div class="brand-sub">Finance workspace</div></div></div>
    <h1>Welcome back</h1>
    <p class="lead">Sign in to see your money, channels and notes.</p>
    <form id="login-form">
      <label class="fld"><span>Email</span><input class="inp" type="email" id="a-email" autocomplete="username" required></label>
      <label class="fld"><span>Password</span><input class="inp" type="password" id="a-pass" autocomplete="current-password" required></label>
      <div class="auth-err" id="a-err" role="alert"></div>
      <button class="btn btn-primary btn-block" id="a-btn" type="submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app">
  <aside class="side glass" id="side">
    <div class="brand"><div class="brand-mark">SA</div><div><div class="brand-name">SA Media Empire</div><div class="brand-sub">Finance workspace</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="me">
      <div class="me-av" id="me-av">S</div>
      <div><div class="me-name" id="me-name">…</div><div class="me-role" id="me-role"></div></div>
      <button class="icon-btn" id="logout" title="Sign out" aria-label="Sign out"><i class="ti ti-logout"></i></button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="Open menu"><i class="ti ti-menu-2"></i></button>
      <div class="brand"><div class="brand-mark">SA</div></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<!-- Private notes page is static so private-notes.js can bind to it -->
<template id="tpl-notes">
  <div class="page-head">
    <div><h1>Private notes</h1><p><i class="ti ti-lock"></i> Only you can read these. Changes save on their own.</p></div>
    <div class="actions"><button class="btn btn-ghost" onclick="ownerDoc.loaded=false;loadOwnerDocument()">Reload</button><button class="btn btn-primary" onclick="saveOwnerDocument()">Save now</button></div>
  </div>
  <div class="glass doc-shell">
    <div id="owner-doc-toolbar" role="toolbar" aria-label="Formatting">
      <select aria-label="Text style" onchange="ownerFormat('formatBlock',this.value)"><option value="p">Normal text</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option></select>
      <button title="Bold" onclick="ownerFormat('bold')"><b>B</b></button>
      <button title="Italic" onclick="ownerFormat('italic')"><i>I</i></button>
      <button title="Underline" onclick="ownerFormat('underline')"><u>U</u></button>
      <button title="Strikethrough" onclick="ownerFormat('strikeThrough')"><s>S</s></button>
      <button title="Bullet list" onclick="ownerFormat('insertUnorderedList')"><i class="ti ti-list"></i></button>
      <button title="Numbered list" onclick="ownerFormat('insertOrderedList')"><i class="ti ti-list-numbers"></i></button>
      <label>Text <input type="color" value="#15302e" onchange="ownerFormat('foreColor',this.value)"></label>
      <label>Highlight <input type="color" value="#fff1a8" onchange="ownerFormat('hiliteColor',this.value)"></label>
      <button title="Align left" onclick="ownerFormat('justifyLeft')"><i class="ti ti-align-left"></i></button>
      <button title="Align center" onclick="ownerFormat('justifyCenter')"><i class="ti ti-align-center"></i></button>
      <button title="Undo" onclick="ownerFormat('undo')"><i class="ti ti-arrow-back-up"></i></button>
      <button title="Redo" onclick="ownerFormat('redo')"><i class="ti ti-arrow-forward-up"></i></button>
      <button title="Clear formatting" onclick="ownerFormat('removeFormat')"><i class="ti ti-clear-formatting"></i></button>
    </div>
    <div class="doc-paper"><div id="owner-doc-editor" contenteditable="false" role="textbox" aria-multiline="true" aria-label="Private notes" spellcheck="true"></div></div>
    <div class="doc-foot"><span id="owner-doc-status" role="status">Loading…</span><span id="owner-doc-count">0 words</span></div>
  </div>
</template>

<div id="toast" role="status"></div>
<script src="uploads.js?v=4"></script>
<script src="hisab-web.js?v=1"></script>
<script src="app.js?v=5"></script>
<script src="private-notes.js?v=2"></script>
</body>
</html>
