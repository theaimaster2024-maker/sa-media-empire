<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"><style>
*{box-sizing:border-box;margin:0;padding:0}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
html,body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#F9FAFB;color:#111827;min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;color-scheme:light}
#loading{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:14px;background:#F9FAFB}
.spinner{width:36px;height:36px;border:2.5px solid #E5E7EB;border-top-color:#7C3AED;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#auth{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:#F9FAFB}
.auth-box{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:36px;width:100%;max-width:380px;box-shadow:0 10px 15px rgba(0,0,0,.07),0 4px 6px rgba(0,0,0,.04)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;justify-content:center}
.auth-icon{width:44px;height:44px;border-radius:12px;background:#7C3AED;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.auth-h{font-size:18px;font-weight:700;color:#111827;letter-spacing:-.02em}
.auth-s{font-size:12px;color:#6B7280;margin-top:2px}
.f-lbl{font-size:11px;font-weight:600;color:#6B7280;display:block;margin-bottom:6px}
.f-inp{width:100%;background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:9px 12px;font-size:14px;color:#111827;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.f-inp:focus{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.f-grp{margin-bottom:14px}
.auth-err{font-size:12px;color:#EF4444;background:#FEE2E2;padding:8px 12px;border-radius:8px;margin-bottom:12px;display:none;border:1px solid rgba(239,68,68,.15)}
.auth-err.on{display:block}
.btn-main{width:100%;background:#7C3AED;color:#fff;border:none;border-radius:8px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-main:hover{background:#6D28D9}
.btn-main:disabled{opacity:.5;cursor:not-allowed}
#app{display:none;min-height:100vh;background:#F9FAFB}
.sidebar{width:256px;background:#fff;border-right:1px solid #E5E7EB;position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:100;transition:transform .25s}
.sidebar.sb-hidden{transform:translateX(-256px)}
.main{margin-left:256px;min-height:100vh;padding:32px 36px;background:#F9FAFB;transition:margin-left .25s}
.main.sb-hidden{margin-left:0}
#fin-sidebar{transition:width .25s,min-width .25s}
#fin-sidebar.fin-sb-hidden{width:0!important;min-width:0!important;overflow:hidden;padding:0!important;border:none!important}
.sb-top{padding:16px;border-bottom:1px solid #E5E7EB}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-icon{width:32px;height:32px;border-radius:8px;background:#7C3AED;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0}
.sb-name{font-size:13px;font-weight:700;color:#111827;line-height:1.3}
.sb-tag{font-size:11px;color:#9CA3AF}
.sb-nav{flex:1;padding:8px;overflow-y:auto;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.nav-sec{font-size:11px;font-weight:600;color:#9CA3AF;padding:12px 8px 4px;letter-spacing:.02em}
.nav-it{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#6B7280;font-size:13px;font-weight:500;transition:all .1s;margin-bottom:1px;user-select:none}
.nav-it:hover{background:#F3F4F6;color:#111827}
.nav-it.on{background:#F5F3FF;color:#7C3AED;font-weight:600}
.nav-it i{font-size:16px;flex-shrink:0;opacity:.8}
.nav-it.on i{opacity:1}
.nav-lock{margin-left:auto;font-size:12px;opacity:.4}
.nav-sub-it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;color:#6B7280;font-size:12px;font-weight:500;transition:all .1s;margin-bottom:1px}
.nav-sub-it:hover{background:#F3F4F6;color:#111827}
.nav-sub-it.on{background:#F5F3FF;color:#7C3AED;font-weight:600}
.sb-user{padding:12px;border-top:1px solid #E5E7EB}
.user-row{display:flex;align-items:center;gap:10px}
.u-av{width:32px;height:32px;border-radius:8px;background:#EDE9FE;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#7C3AED;flex-shrink:0}
.u-name{font-size:13px;font-weight:600;color:#111827}
.u-role{font-size:11px}
.role-owner{color:#7C3AED;font-weight:600}
.role-manager{color:#10B981;font-weight:600}
.role-employee{color:#F59E0B;font-weight:600}
.logout-btn{margin-left:auto;background:none;border:none;cursor:pointer;color:#9CA3AF;font-size:16px;padding:4px;border-radius:6px;transition:.15s;line-height:1}
.logout-btn:hover{color:#EF4444;background:#FEE2E2}
.main{margin-left:256px;min-height:100vh;padding:32px 36px;background:#F9FAFB}
.pg{display:none}
.pg.on{display:block}
.pg-h{margin-bottom:24px}
.pg-t{font-size:20px;font-weight:700;color:#111827;letter-spacing:-.02em}
.pg-s{font-size:13px;color:#6B7280;margin-top:4px;line-height:1.5}
.pg-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .2s,transform .2s}
.stat:hover{box-shadow:0 4px 6px rgba(0,0,0,.07);transform:translateY(-1px)}
.stat-lbl{font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.stat-lbl i{font-size:14px;color:#7C3AED;opacity:.7}
.stat-val{font-size:24px;font-weight:700;color:#111827;letter-spacing:-.5px}
.stat-sub{font-size:11px;color:#9CA3AF;margin-top:4px}
.panel{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:16px}
.p-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.p-ti{font-size:11px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.p-ti i{font-size:15px;color:#7C3AED}
.tabs{display:flex;gap:2px;margin-bottom:16px;background:#F3F4F6;padding:3px;border-radius:8px;width:fit-content}
.tab{font-size:12px;padding:5px 14px;border-radius:6px;cursor:pointer;border:none;background:transparent;color:#6B7280;font-family:inherit;transition:.12s;font-weight:500}
.tab:hover{color:#111827}
.tab.on{background:#fff;color:#111827;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.m-nav{display:flex;align-items:center;gap:6px}
.m-btn{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:6px 10px;cursor:pointer;color:#6B7280;font-size:14px;transition:.12s;line-height:1}
.m-btn:hover{border-color:#C4B5FD;color:#7C3AED;background:#F5F3FF}
.m-lbl{font-size:13px;font-weight:600;color:#111827;min-width:120px;text-align:center}
.exp-list{display:flex;flex-direction:column;gap:6px;max-height:460px;overflow-y:auto;padding-right:2px}
.exp-list::-webkit-scrollbar{width:3px}
.exp-list::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:3px}
.exp-it{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#fff;border-radius:8px;border:1px solid #E5E7EB;transition:all .15s}
.exp-it:hover{border-color:#C4B5FD;background:#F5F3FF}
.exp-ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.exp-inf{flex:1;min-width:0}
.exp-nm{font-size:13px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-mt{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.exp-no{font-size:11px;color:#9CA3AF}
.exp-by{font-size:11px;color:#9CA3AF;display:flex;align-items:center;gap:3px;margin-top:2px}
.exp-rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.exp-am{font-size:14px;font-weight:700;color:#111827}
.exp-dt{font-size:11px;color:#9CA3AF}
.del-btn{background:none;border:none;cursor:pointer;color:#9CA3AF;font-size:14px;padding:3px;border-radius:5px;transition:.15s;line-height:1}
.del-btn:hover{color:#EF4444;background:#FEE2E2}
.empty{text-align:center;padding:48px 20px;color:#9CA3AF}
.empty i{font-size:32px;display:block;margin-bottom:12px;opacity:.25}
.empty p{font-size:13px;line-height:1.6}
.cat-list{display:flex;flex-direction:column;gap:10px}
.cat-row{display:flex;align-items:center;gap:10px}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat-nm{font-size:12px;color:#6B7280;flex:0 0 96px;font-weight:500}
.cat-trk{flex:1;height:6px;background:#F3F4F6;border-radius:3px;overflow:hidden}
.cat-fill{height:100%;border-radius:3px;transition:width .6s}
.cat-am{font-size:12px;font-weight:600;color:#111827;min-width:68px;text-align:right}
.form-g{display:flex;flex-direction:column;gap:14px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up-zone{border:1.5px dashed #D1D5DB;border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:.15s;background:#F9FAFB}
.up-zone:hover{border-color:#7C3AED;background:#F5F3FF}
.up-zone input{display:none}
.up-ico{font-size:20px;color:#9CA3AF;margin-bottom:4px}
.up-txt{font-size:12px;color:#6B7280;font-weight:500}
.up-ht{font-size:11px;color:#9CA3AF;margin-top:2px}
.f-inf{font-size:11px;color:#7C3AED;margin-top:5px;display:flex;align-items:center;gap:4px}
.btn-p{font-family:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:9px 18px;cursor:pointer;transition:all .15s;border:none;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:#7C3AED;color:#fff}
.btn-p:hover{background:#6D28D9}
.btn-p:active{transform:scale(.99)}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-d{font-family:inherit;font-size:12px;font-weight:600;border-radius:8px;padding:8px 16px;cursor:pointer;transition:.15s;border:1px solid rgba(239,68,68,.2);display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:#FEE2E2;color:#EF4444}
.btn-d:hover{border-color:#EF4444}
.btn-sm{font-family:inherit;font-size:11px;font-weight:600;border-radius:6px;padding:6px 12px;cursor:pointer;transition:.12s;border:1px solid #E5E7EB;background:#fff;color:#6B7280;display:flex;align-items:center;gap:5px}
.btn-sm:hover{border-color:#C4B5FD;color:#7C3AED;background:#F5F3FF}
.exp-row{display:flex;gap:8px;margin-top:12px}
.divider{height:1px;background:#E5E7EB;margin:14px 0}
.two-col{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:#F9FAFB;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999;box-shadow:0 10px 15px rgba(0,0,0,.1)}
.toast.on{opacity:1}
.u-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#F9FAFB;border-radius:8px;border:1px solid #E5E7EB;margin-bottom:6px}
.role-sel{font-family:inherit;font-size:12px;background:#fff;border:1px solid #E5E7EB;border-radius:6px;padding:4px 8px;color:#111827;outline:none;cursor:pointer}
.role-sel:focus{border-color:#7C3AED}
.tb{width:30px;height:30px;border-radius:6px;border:none;background:transparent;cursor:pointer;color:#6B7280;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.12s;flex-shrink:0}
.tb:hover{background:#F3F4F6;color:#111827}
.tb.on{background:#F5F3FF;color:#7C3AED}
.bclr{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:.15s;flex-shrink:0}
.bclr.on{border-color:#111827;transform:scale(1.2)}
.fn-nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:500;color:#6B7280;cursor:pointer;margin-bottom:2px;transition:.15s}
.fn-nav:hover{background:#F5F3FF;color:#7C3AED}
.fn-nav.active{background:#F5F3FF;color:#7C3AED;font-weight:600}
.fn-nav-owner{display:none}
.fin-card{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:18px}
.fin-card-sm{background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;padding:14px}
.fin-badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.fin-table{width:100%;border-collapse:collapse}
.fin-table th{font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;text-align:left;border-bottom:1px solid #F3F4F6}
.fin-table td{font-size:13px;color:#374151;padding:11px 12px;border-bottom:1px solid #F9FAFB}
.fin-table tr:hover td{background:#FAFAFA}
.fin-inp{width:100%;background:#fff;border:1.5px solid #E5E7EB;border-radius:8px;padding:9px 12px;font-size:13px;color:#111827;font-family:inherit;outline:none;box-sizing:border-box}
.fin-inp:focus{border-color:#7C3AED}
.fin-lbl{font-size:11px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.fin-btn{border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.fin-btn-primary{background:#7C3AED;color:#fff}
.fin-btn-secondary{background:#F3F4F6;color:#374151}
.fin-btn-danger{background:#FEF2F2;color:#EF4444;border:1px solid #FECACA}
.fin-btn-primary:hover{background:#6D28D9}
.fin-btn-secondary:hover{background:#E5E7EB}
.fin-stat-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.b-card{position:absolute;background:#fff;border-radius:12px;border:1px solid #E5E7EB;box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);min-width:200px;min-height:110px;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s;z-index:2}
.b-card:hover{border-color:#C4B5FD;box-shadow:0 4px 12px rgba(124,58,237,.12)}
.b-card.bsel{border-color:#7C3AED!important;box-shadow:0 0 0 2px rgba(124,58,237,.15),0 4px 12px rgba(124,58,237,.12)!important}
.b-card-head{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid #F3F4F6;border-radius:12px 12px 0 0;flex-shrink:0;cursor:move}
.b-card-ico{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.b-card-ttl{flex:1;font-size:13px;font-weight:600;color:#111827;outline:none;border:none;background:transparent;cursor:text;font-family:inherit;min-width:0}
.b-card-body{flex:1;padding:10px 12px;font-size:13px;color:#374151;outline:none;line-height:1.7;cursor:text;word-break:break-word;white-space:pre-wrap;overflow-y:auto}
.b-card-body:empty::before{content:attr(data-ph);color:#9CA3AF}
.b-card-body img{max-width:100%;border-radius:8px;margin:3px 0;display:block}
.b-del{background:none;border:none;cursor:pointer;color:#9CA3AF;font-size:14px;padding:2px;transition:.15s;opacity:0;border-radius:5px}
.b-card:hover .b-del{opacity:1}
.b-del:hover{color:#EF4444;background:#FEE2E2}
.brh{position:absolute;z-index:20;opacity:0;transition:.15s}
.b-card:hover .brh{opacity:1}
.brh-n{top:-4px;left:16px;right:16px;height:8px;cursor:n-resize}
.brh-s{bottom:-4px;left:16px;right:16px;height:8px;cursor:s-resize}
.brh-e{right:-4px;top:16px;bottom:16px;width:8px;cursor:e-resize}
.brh-w{left:-4px;top:16px;bottom:16px;width:8px;cursor:w-resize}
.brh-se{bottom:-6px;right:-6px;width:12px;height:12px;cursor:se-resize;border-radius:50%;background:#7C3AED}
.brh-sw{bottom:-6px;left:-6px;width:12px;height:12px;cursor:sw-resize;border-radius:50%;background:#C4B5FD}
.brh-ne{top:-6px;right:-6px;width:12px;height:12px;cursor:ne-resize;border-radius:50%;background:#C4B5FD}
.brh-nw{top:-6px;left:-6px;width:12px;height:12px;cursor:nw-resize;border-radius:50%;background:#C4B5FD}
.bcd{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid #7C3AED;box-shadow:0 0 0 2px rgba(124,58,237,.3);cursor:crosshair;opacity:0;transition:opacity .15s,transform .15s;z-index:20}
.b-card:hover .bcd,.b-sticky:hover .bcd{opacity:1}
.bcd:hover{opacity:1!important;transform:scale(1.4)!important;background:#7C3AED}
.bcd-t{top:-7px;left:50%;transform:translateX(-50%)}
.bcd-b{bottom:-7px;left:50%;transform:translateX(-50%)}
.bcd-l{left:-7px;top:50%;transform:translateY(-50%)}
.bcd-r{right:-7px;top:50%;transform:translateY(-50%)}
.bcd-t:hover{transform:translateX(-50%) scale(1.4)}
.bcd-b:hover{transform:translateX(-50%) scale(1.4)}
.bcd-l:hover{transform:translateY(-50%) scale(1.4)}
.bcd-r:hover{transform:translateY(-50%) scale(1.4)}
.b-sticky{position:absolute;border-radius:10px;padding:12px;cursor:move;min-width:160px;min-height:110px;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.b-sticky-txt{flex:1;font-size:13px;font-weight:500;outline:none;cursor:text;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.b-sticky-txt:empty::before{content:'Note...';opacity:.4}
.b-sdel{align-self:flex-end;background:rgba(0,0,0,.1);border:none;border-radius:5px;cursor:pointer;font-size:13px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s;margin-bottom:4px}
.b-sticky:hover .b-sdel{opacity:1}
@media(max-width:720px){
  .sidebar{transform:translateX(-100%);transition:.2s}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:16px}
  .mob-btn{display:flex!important}
}
.mob-btn{display:none;position:fixed;top:12px;left:12px;z-index:200;background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:18px;color:#111827;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* Editor review only: video left, independently scrollable comments right. */
#proj-detail-modal.editor-review-open > div{max-width:1240px!important;height:90vh;min-height:0}
#pdm-tab-review{min-height:0;flex-direction:row!important}
#pdm-tab-review > div:first-child{flex:1!important;min-width:0;overflow-y:auto;padding:16px!important}
#editor-review-sidebar{flex:0 0 380px;min-width:0;overflow-y:auto;border-left:1px solid #E5E7EB;padding-bottom:12px}
#pdm-add-comment{padding:0 12px!important}
#pdm-add-comment > div{margin-top:12px!important}
#pdm-add-comment > div > div:last-child{position:sticky;bottom:0;background:#F9FAFB;padding:8px 0;z-index:1}
@media(max-width:760px){
 #pdm-tab-review{flex-direction:column!important;overflow-y:auto!important}
 #pdm-tab-review > div:first-child{flex:none!important;overflow:visible}

async function loadVideoUploads(){

 _uploadChannels=channels.data||[];_uploadRows=(projects.data||[]).map(p=>({...p,editor_name:eds.data.find(e=>e.id===p.editor_id)?.name||'Unassigned'}));
 el.innerHTML=`<div class="hd-top"><div><div class="hd-eyebrow">CONTENT OPERATIONS</div><h1>Video Upload<span>.</span></h1><p class="upload-intro">Completed videos, ready for the next step.</p></div><button class="hd-refresh" onclick="loadVideoUploads()">↻ Refresh</button></div><div class="upload-summary">${[['ready','Ready to upload'],['uploaded','Uploaded'],['published','Published']].map(([key,label])=>`<button onclick="setUploadFilter('${key}')"><small>${label}</small><strong>${_uploadRows.filter(p=>p.upload_status===key).length}</strong></button>`).join('')}</div><div class="upload-toolbar"><div class="upload-filters">${[['queue','Upload queue'],['ready','Ready'],['uploaded','Uploaded'],['published','Published'],['all','All videos']].map(([key,label])=>`<button data-upload-filter="${key}" onclick="setUploadFilter('${key}')">${label}</button>`).join('')}</div><input class="f-inp" id="upload-search" placeholder="Search video or editor…" value="${finEscape(_uploadSearch)}" oninput="_uploadSearch=this.value;renderUploadList()"></div><div id="upload-list"></div><p class="hd-footnote">This workspace tracks upload progress. Upload the file to YouTube first, then confirm its status here. Payment history is separate.</p>`;renderUploadList();

async function editVideoUpload(id){
 if(!['owner','manager'].includes(profile?.role))return;
 const {data:p,error}=await sb.from('editor_projects').select('*').eq('id',id).single();if(error||!p?.is_completed){toast(error?.message||'This project is no longer complete');await loadVideoUploads();return}

 document.body.append(d);d.querySelector('[name=status]').value=p.upload_status;d.querySelector('[name=channel]').value=p.upload_channel_id||'';d.querySelector('[type=button]').onclick=()=>d.close();d.onclose=()=>d.remove();d.showModal();
