.b-card{position:absolute;background:#fff;border-radius:12px;border:1px solid #E5E7EB;box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);min-width:200px;min-height:110px;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s;z-index:2}

.brh{position:absolute;z-index:20;opacity:0;transition:.15s}
.b-card:hover .brh{opacity:1}
.brh-n{top:-4px;left:16px;right:16px;height:8px;cursor:n-resize}
.brh-s{bottom:-4px;left:16px;right:16px;height:8px;cursor:s-resize}
.brh-e{right:-4px;top:16px;bottom:16px;width:8px;cursor:e-resize}
.brh-w{left:-4px;top:16px;bottom:16px;width:8px;cursor:w-resize}
.brh-se{bottom:-6px;right:-6px;width:12px;height:12px;cursor:se-resize;border-radius:50%;background:#7C3AED}
.brh-sw{bottom:-6px;left:-6px;width:12px;height:12px;cursor:sw-resize;border-radius:50%;background:#C4B5FD}
.brh-ne{top:-6px;right:-6px;width:12px;height:12px;cursor:ne-resize;border-radius:50%;background:#C4B5FD}
.brh-nw{top:-6px;left:-6px;width:12px;height:12px;cursor:nw-resize;border-radius:50%;background:#C4B5FD}
.bcd{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid #7C3AED;box-shadow:0 0 0 2px rgba(124,58,237,.3);cursor:crosshair;opacity:0;transition:opacity .15s,transform .15s;z-index:20}

.bcd-l{left:-7px;top:50%;transform:translateY(-50%)}
.bcd-r{right:-7px;top:50%;transform:translateY(-50%)}

.bcd-l:hover{transform:translateY(-50%) scale(1.4)}
.bcd-r:hover{transform:translateY(-50%) scale(1.4)}

}function finEscape(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function loadFinChannelDetail(scope){
 _finDetailScope=scope;const el=document.getElementById('fin-tab-channels');if(!el)return;el.innerHTML='<div class="fin-card">Loading transactions…</div>';
 const whole=scope==='whole_business';let iq=sb.from('finance_income').select('*'),eq=sb.from('finance_expenses').select('*');iq=whole?iq.is('channel_id',null):iq.eq('channel_id',scope);eq=whole?eq.eq('scope','whole_business'):eq.eq('channel_id',scope);
 const [ir,er]=await Promise.all([iq.order('date',{ascending:false}),eq.order('date',{ascending:false})]);if(_finDetailScope!==scope)return;if(ir.error||er.error){el.innerHTML='<div class="fin-card">'+finEscape((ir.error||er.error).message)+'</div>';return}
 const income=ir.data||[],expenses=er.data||[],month=document.getElementById('fin-month-sel')?.value||new Date().toISOString().slice(0,7),sum=(rows)=>rows.reduce((n,r)=>n+Number(r.amount),0);
 const received=income.filter(r=>r.status==='received'),paid=expenses.filter(r=>r.approval_status==='paid'),totalIncome=sum(received),totalExpense=sum(paid),monthlyIncome=sum(received.filter(r=>r.date?.startsWith(month))),monthlyExpense=sum(paid.filter(r=>(r.payment_date||r.date)?.startsWith(month))),name=whole?'Whole Business':_finChannels.find(c=>c.id===scope)?.name||'Channel';
 const rows=[...income.map(r=>({...r,kind:'Income',state:r.status})),...expenses.map(r=>({...r,kind:'Expense',state:r.approval_status}))].sort((a,b)=>String(b.payment_date||b.date).localeCompare(String(a.payment_date||a.date)));
 el.innerHTML=`<button class="fin-btn fin-btn-secondary" onclick="finTab('channels')">← All channels</button><div style="margin:20px 0"><h2 style="font-size:24px;color:#111827">${finEscape(name)}</h2><p style="color:#6b7280;margin-top:5px">${finEscape(month)} monthly performance · Full transaction history below</p></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px">${finStatCard('Monthly income',fmtBDTFull(monthlyIncome),'#10B981','ti-trending-up','#D1FAE5')}${finStatCard('Monthly expense',fmtBDTFull(monthlyExpense),'#EF4444','ti-trending-down','#FEE2E2')}${finStatCard('Monthly net',fmtBDTFull(monthlyIncome-monthlyExpense),'#7057dc','ti-chart-bar','#F5F3FF')}</div><div class="fin-card" style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px"><div>All-time income<br><b>${fmtBDTFull(totalIncome)}</b></div><div>All-time paid expense<br><b>${fmtBDTFull(totalExpense)}</b></div><div>All-time net<br><b>${fmtBDTFull(totalIncome-totalExpense)}</b></div><div>Pending / approved expense<br><b>${fmtBDTFull(sum(expenses.filter(r=>['pending','approved'].includes(r.approval_status))))}</b></div></div><div class="fin-card" style="overflow-x:auto"><table class="fin-table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Payee / Source</th><th>Amount</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fmtDate(r.payment_date||r.date)}</td><td>${finEscape(r.description||r.kind)}${r.editor_project_id?'<br><small>Editor project #'+r.editor_project_id+'</small>':''}</td><td>${finEscape(r.category||r.source||'—')}</td><td>${finEscape(r.payee||r.source||'—')}</td><td style="font-weight:700;white-space:nowrap;color:${r.kind==='Income'?'#059669':'#dc2626'}">${r.kind==='Income'?'+':'−'}${fmtBDTFull(r.amount)}</td><td>${finStatusBadge(r.state)}</td></tr>`).join('')||'<tr><td colspan="6" style="padding:28px;text-align:center">No transactions yet</td></tr>'}</tbody></table></div>`;
